<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#58c3b2" />
    <title>청춘캠퍼스 후기 & 애프터 신청</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles/main.css" />
  </head>
  <body class="review-page">
    <main id="review-form" class="review-shell" aria-label="청춘캠퍼스 후기 및 애프터 신청"></main>

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="src/js/config/supabase-config.js"></script>
    <script defer src="src/js/config/review-config.js"></script>
    <script defer src="src/js/services/supabase-client.js"></script>
    <script defer src="src/js/services/review-form-service.js"></script>
    <script defer src="src/js/ui/render-review-form.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", function () {
        window.CheongchunCampus.ui.renderReviewForm(
          window.CheongchunCampus.config.reviewForm,
          document.getElementById("review-form")
        );
      });
    </script>
  </body>
</html>
