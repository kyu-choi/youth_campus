<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#58c3b2" />
    <title>청춘 캠퍼스 관리자</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles/admin.css" />
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-topbar">
        <div>
          <p class="admin-eyebrow">Cheongchun Campus</p>
          <h1>신청자 관리</h1>
        </div>
        <div class="admin-session">
          <span id="admin-email"></span>
          <button id="logout-button" class="ghost-button" type="button" hidden>
            로그아웃
          </button>
        </div>
      </header>

      <section id="login-panel" class="login-panel">
        <form id="login-form" class="login-card">
          <h2>관리자 로그인</h2>
          <label>
            이메일
            <input id="login-email" type="email" autocomplete="email" required />
          </label>
          <label>
            비밀번호
            <input
              id="login-password"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>
          <button class="primary-button" type="submit">로그인</button>
          <p id="login-message" class="form-message" role="status"></p>
        </form>
      </section>

      <section id="admin-panel" class="admin-panel" hidden>
        <section class="summary-grid" aria-label="신청 현황 요약">
          <article class="summary-card">
            <span>전체 신청</span>
            <strong id="total-count">0</strong>
          </article>
          <article class="summary-card">
            <span>입금 확인</span>
            <strong id="paid-count">0</strong>
          </article>
          <article class="summary-card">
            <span>매칭 후보</span>
            <strong id="candidate-count">0</strong>
          </article>
          <article class="summary-card">
            <span>매칭 완료</span>
            <strong id="matched-count">0</strong>
          </article>
          <article class="summary-card subtle-card">
            <span>남성</span>
            <strong id="male-count">0</strong>
          </article>
          <article class="summary-card subtle-card">
            <span>여성</span>
            <strong id="female-count">0</strong>
          </article>
          <article class="summary-card subtle-card">
            <span>미입금</span>
            <strong id="unpaid-count">0</strong>
          </article>
          <article class="summary-card subtle-card">
            <span>검토 필요</span>
            <strong id="review-needed-count">0</strong>
          </article>
        </section>

        <section class="tool-grid">
          <div class="table-panel">
            <div class="panel-heading">
              <div>
                <h2>신청자 목록</h2>
                <p id="table-caption">필터 조건에 맞는 신청자를 표시합니다.</p>
              </div>
              <button id="refresh-button" class="ghost-button" type="button">
                새로고침
              </button>
            </div>

            <div class="mobile-flow" aria-label="모바일 신청자 보기 선택">
              <div class="mobile-program-tabs">
                <button
                  class="ghost-button"
                  type="button"
                  data-mobile-program="1:1 카톡 소개팅"
                >
                  1대1 소개팅
                </button>
                <button
                  class="ghost-button"
                  type="button"
                  data-mobile-program="다대다 로테이션 소개팅"
                >
                  로테이션 소개팅
                </button>
              </div>
              <div
                id="mobile-date-choices"
                class="mobile-date-choices"
                hidden
              ></div>
              <p id="mobile-flow-hint" class="mobile-flow-hint"></p>
            </div>

            <div class="filter-bar">
              <input
                id="search-input"
                type="search"
                placeholder="이름, 학교, 연락처, 카카오톡 검색"
              />
              <select id="date-filter">
                <option value="">전체 일정</option>
              </select>
              <select id="program-filter">
                <option value="">전체 프로그램</option>
                <option value="다대다 로테이션 소개팅">로테이션 소개팅</option>
                <option value="1:1 카톡 소개팅">1:1 카톡 소개팅</option>
              </select>
              <select id="gender-filter">
                <option value="">전체 성별</option>
                <option value="남성">남성</option>
                <option value="여성">여성</option>
              </select>
              <select id="status-filter">
                <option value="">전체 상태</option>
                <option value="new">신규</option>
                <option value="reviewed">검토</option>
                <option value="matched">매칭</option>
                <option value="rejected">제외</option>
                <option value="cancelled">취소</option>
              </select>
              <select id="payment-filter">
                <option value="">전체 입금</option>
                <option value="unpaid">미입금</option>
                <option value="deposit_paid">예약금</option>
                <option value="paid">입금완료</option>
                <option value="refunded">환불</option>
                <option value="waived">면제</option>
              </select>
              <select id="matching-filter">
                <option value="">전체 매칭</option>
                <option value="unmatched">미매칭</option>
                <option value="candidate">후보</option>
                <option value="matched">매칭완료</option>
                <option value="notified">안내완료</option>
                <option value="cancelled">취소</option>
              </select>
            </div>

            <div class="table-wrap">
              <table class="response-table">
                <thead>
                  <tr>
                    <th><button type="button" data-sort-key="submitted_at">접수</button></th>
                    <th><button type="button" data-sort-key="status">검토</button></th>
                    <th><button type="button" data-sort-key="payment_status">입금</button></th>
                    <th><button type="button" data-sort-key="matching_status">매칭</button></th>
                    <th><button type="button" data-sort-key="program_type">프로그램</button></th>
                    <th><button type="button" data-sort-key="name">이름</button></th>
                    <th><button type="button" data-sort-key="gender">성별</button></th>
                    <th><button type="button" data-sort-key="age">나이</button></th>
                    <th><button type="button" data-sort-key="school">학교</button></th>
                    <th><button type="button" data-sort-key="preferred_date">일정</button></th>
                    <th>메모</th>
                    <th>매칭</th>
                  </tr>
                </thead>
                <tbody id="response-table-body"></tbody>
              </table>
            </div>
            <div
              id="mobile-response-list"
              class="mobile-response-list"
              aria-label="모바일 신청자 목록"
            ></div>
          </div>

          <aside class="detail-panel">
            <section class="detail-card">
              <h2>상세 정보</h2>
              <div id="empty-detail" class="empty-state">
                신청자를 선택하면 세부 정보가 표시됩니다.
              </div>
              <div id="detail-content" hidden></div>
            </section>

            <section class="detail-card">
              <h2>상태 및 메모 수정</h2>
              <form id="review-form" class="review-form">
                <label>
                  검토상태
                  <select id="review-status">
                    <option value="new">신규</option>
                    <option value="reviewed">검토 완료</option>
                    <option value="matched">매칭 완료</option>
                    <option value="rejected">제외</option>
                    <option value="cancelled">취소</option>
                  </select>
                </label>
                <label>
                  입금상태
                  <select id="payment-status">
                    <option value="unpaid">미입금</option>
                    <option value="deposit_paid">예약금</option>
                    <option value="paid">입금완료</option>
                    <option value="refunded">환불</option>
                    <option value="waived">면제</option>
                  </select>
                </label>
                <label>
                  매칭상태
                  <select id="matching-status">
                    <option value="unmatched">미매칭</option>
                    <option value="candidate">후보</option>
                    <option value="matched">매칭완료</option>
                    <option value="notified">안내완료</option>
                    <option value="cancelled">취소</option>
                  </select>
                </label>
                <input
                  id="review-score"
                  type="number"
                  placeholder="점수"
                  min="0"
                  max="100"
                />
                <input id="review-group" type="text" placeholder="매칭 그룹" />
                <textarea
                  id="review-note"
                  rows="5"
                  placeholder="관리자 메모"
                ></textarea>
                <button class="primary-button" type="submit">저장</button>
                <p id="review-message" class="form-message" role="status"></p>
              </form>
            </section>

            <section class="detail-card">
              <h2>매칭 만들기</h2>
              <div class="match-slots">
                <p>남성: <strong id="selected-male">미선택</strong></p>
                <p>여성: <strong id="selected-female">미선택</strong></p>
              </div>
              <form id="match-form" class="review-form">
                <input id="match-date" type="text" placeholder="행사 일정" />
                <input id="match-program" type="text" placeholder="프로그램" />
                <input id="match-group" type="text" placeholder="매칭 그룹" />
                <textarea
                  id="match-note"
                  rows="3"
                  placeholder="매칭 메모"
                ></textarea>
                <button class="primary-button" type="submit">매칭 저장</button>
                <p id="match-message" class="form-message" role="status"></p>
              </form>
            </section>
          </aside>
        </section>

        <section class="summary-tables">
          <article class="detail-card">
            <h2>일정별 현황</h2>
            <div id="response-summary" class="mini-table"></div>
          </article>
          <article class="detail-card">
            <h2>음료 준비 수량</h2>
            <div id="drink-summary" class="mini-table"></div>
          </article>
        </section>
      </section>
    </main>

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="src/js/config/supabase-config.js"></script>
    <script defer src="src/js/services/supabase-client.js"></script>
    <script defer src="src/js/admin.js"></script>
  </body>
</html>
