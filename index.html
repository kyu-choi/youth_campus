<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>청춘캠퍼스</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="petal petal-a"></div>
      <div class="petal petal-b"></div>
      <div class="petal petal-c"></div>
      <div class="petal petal-d"></div>

      <main class="landing-card">
        <p class="eyebrow">Spring Link Garden</p>
        <h1 class="banner-title">청춘캠퍼스</h1>
        <p class="intro">
          지인 소개는 부담스럽고, 과팅보다 설레는 우리들의 캠퍼스
        </p>

        <section class="instagram-card" aria-labelledby="instagram-title">
          <div>
            <p id="instagram-title" class="section-label">Instagram</p>
            <a
              id="instagram-link"
              class="instagram-link"
              href="#"
              target="_blank"
              rel="noreferrer"
            ></a>
          </div>
          <span class="instagram-badge" aria-hidden="true">Blooming Now</span>
        </section>

        <section class="link-section" aria-label="주요 링크">
          <div id="link-list" class="link-list"></div>
        </section>

        <footer class="contact-footer">
          개인적인 문의는
          <a
            class="contact-link"
            href="http://pf.kakao.com/_DGhCX"
            target="_blank"
            rel="noreferrer"
            >카카오톡 채널</a
          >로 연락 주세요.
        </footer>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
