<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#58c3b2" />
    <title>청춘 캠퍼스</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles/main.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="petal petal-a"></div>
      <div class="petal petal-b"></div>
      <div class="petal petal-c"></div>
      <div class="petal petal-d"></div>

      <main class="landing-card">
        <h1 id="hero-title" class="banner-title"></h1>
        <p id="hero-subtitle" class="intro"></p>

        <section class="instagram-card" aria-labelledby="instagram-title">
          <div>
            <p id="instagram-title" class="section-label">Instagram</p>
            <a
              id="instagram-link"
              class="instagram-link"
              href="#"
              target="_blank"
              rel="noreferrer"
            ></a>
          </div>
          <span
            id="instagram-badge"
            class="instagram-badge"
            aria-hidden="true"
          ></span>
        </section>

        <section class="link-section" aria-label="주요 링크">
          <div id="link-list" class="link-list"></div>
        </section>

        <footer class="contact-footer">
          <span id="contact-prefix"></span>
          <a
            id="contact-link"
            class="contact-link"
            href="#"
            target="_blank"
            rel="noreferrer"
          ></a>
          <span id="contact-suffix"></span>
        </footer>
      </main>

      <section
        id="application-form"
        class="application-shell"
        aria-label="이음 로테이션 소개팅 신청서"
      ></section>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="src/js/config/site-config.js"></script>
    <script defer src="src/js/config/supabase-config.js"></script>
    <script defer src="src/js/config/application-config.js"></script>
    <script defer src="src/js/dom/landing-elements.js"></script>
    <script defer src="src/js/services/supabase-client.js"></script>
    <script defer src="src/js/services/campus-content-service.js"></script>
    <script defer src="src/js/services/application-form-service.js"></script>
    <script defer src="src/js/ui/render-hero.js"></script>
    <script defer src="src/js/ui/render-instagram.js"></script>
    <script defer src="src/js/ui/render-quick-links.js"></script>
    <script defer src="src/js/ui/render-contact.js"></script>
    <script defer src="src/js/ui/render-application-form.js"></script>
    <script defer src="src/js/main.js"></script>
  </body>
</html>
